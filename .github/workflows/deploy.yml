name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # Regenerates src/content/elves-dwarf-satellites.json from the FITS
      # catalog at build time (see scripts/sync-data.sh), so the footprint
      # viewer never ships stale positions. The pinned notebook environment
      # includes the execution kernel as well as nbconvert and its scientific
      # dependencies, keeping the committed HTML freshness check reproducible.
      - name: Install Python dependencies
        run: python -m pip install --requirement requirements-notebooks.txt

      - name: Install dependencies
        run: npm ci

      - name: Check rendered tutorial notebooks
        run: |
          npm run render:notebooks
          git diff --exit-code -- public/tutorials/rendered/

      - name: Build site
        run: npm run build

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
